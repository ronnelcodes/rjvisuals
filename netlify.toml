[build]
  command = "node build-public.mjs"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/admin-gallery"
  to = "/.netlify/functions/admin-gallery"
  status = 200

[[redirects]]
  from = "/api/client-gallery"
  to = "/.netlify/functions/client-gallery"
  status = 200

[[redirects]]
  from = "/client-galleries"
  to = "/gallery.html"
  status = 302
  force = true

[[redirects]]
  from = "/client-galleries.html"
  to = "/gallery.html"
  status = 302
  force = true

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/gallery.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.js"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/api/gallery-recovery"
  to = "/.netlify/functions/gallery-recovery"
  status = 200
